:root{
  --b0:#08224C; --b1:#0B2E63; --b2:#1560CB; --b3:#1A6FE4; --b4:#59A0FF;
  --ink:#fff; --mut:#A9C7F2; --line:rgba(255,255,255,.18); --glass:rgba(255,255,255,.085);
  --acc:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#06183a;
  font-family:P,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}

/* ---------- FON ---------- */
#bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120vw 95vh at 8% -18%, #2E82F2 0%, rgba(46,130,242,0) 55%),
    radial-gradient(95vw 85vh at 104% 112%, #0B4CA0 0%, rgba(11,76,160,0) 58%),
    linear-gradient(158deg,#0B2E63 0%, #1354AF 52%, #09265A 100%);
  animation:drift 26s ease-in-out infinite alternate}
#bg:after{content:"";position:absolute;inset:0;
  background:radial-gradient(130vh 120vh at 50% 42%, rgba(0,0,0,0) 38%, rgba(3,14,34,.5) 100%)}
@keyframes drift{from{background-position:0 0,0 0,0 0,0 0}to{background-position:4vw 2vh,-4vw -2vh,0 0,0 0}}
body.light #bg{background:
  radial-gradient(110vw 90vh at 6% -20%, rgba(26,111,228,.13) 0%, rgba(26,111,228,0) 60%),
  radial-gradient(90vw 80vh at 106% 116%, rgba(26,111,228,.10) 0%, rgba(26,111,228,0) 60%),
  #fff}
body.light #bg:after{background:none}

/* ---------- SLAYD ---------- */
#deck{position:fixed;inset:0;z-index:1}
.slide{position:absolute;inset:0;padding:9vh 7vw 11vh;display:flex;flex-direction:column;
  justify-content:center;color:var(--ink);opacity:0;visibility:hidden;
  transform:translateY(14px) scale(1.012);
  transition:opacity .5s ease, transform .6s cubic-bezier(.16,1,.3,1), visibility .5s}
.slide.on{opacity:1;visibility:visible;transform:none}
body.light .slide{color:#0C1B33}

/* ---------- REVEAL ---------- */
.r{opacity:0;transform:translateY(30px);filter:blur(7px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1),filter .7s ease;
  transition-delay:calc(var(--i,0) * 80ms)}
.r.show{opacity:1;transform:none;filter:none}
.rw{clip-path:inset(0 102% -.25em 0);opacity:1;transform:none;filter:none;
  transition:clip-path 1s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i,0) * 80ms)}
.rw.show{clip-path:inset(0 -.2em -.25em 0)}
.rp{opacity:0;transform:scale(.82);filter:none;
  transition:opacity .4s ease, transform .6s cubic-bezier(.34,1.5,.5,1);
  transition-delay:calc(var(--i,0) * 80ms)}
.rp.show{opacity:1;transform:none}

/* ---------- TIPOGRAFIYA ---------- */
.kick{display:flex;align-items:center;gap:1.1vw;font-size:.95vw;font-weight:500;
  letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:3.2vh}
.kick i{display:block;height:2px;width:0;background:var(--b4);border-radius:2px}
.slide.on .kick i{animation:rule .9s .2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rule{to{width:3.4vw}}
body.light .kick{color:#5B7391}
body.light .kick i{background:var(--b3)}

h1{font-size:6.6vw;font-weight:700;line-height:.98;letter-spacing:-.035em}
h2{font-size:4.4vw;font-weight:700;line-height:1.06;letter-spacing:-.028em}
h3{font-size:2.6vw;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.lead{font-size:1.85vw;font-weight:500;line-height:1.4;margin-top:2.4vh}
.sub{font-size:1.25vw;font-weight:400;line-height:1.55;color:var(--mut);margin-top:1.8vh}
body.light .sub{color:#5B7391}
.wt{color:#fff}
body.light .wt{color:#0C1B33}
em.q{font-style:italic;font-weight:400}

.big{font-size:17vw;font-weight:700;line-height:.84;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums}
.lbl{font-size:2.3vw;font-weight:700;letter-spacing:.02em;margin-top:1.2vh}
.dim{opacity:.42}

/* ---------- KARTALAR ---------- */
.card{background:var(--glass);border:1px solid var(--line);border-radius:1vw;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.light .card{background:rgba(26,111,228,.065);border-color:rgba(26,111,228,.14);backdrop-filter:none}
.row{display:flex;align-items:center;gap:1.4vw;padding:1.75vh 1.9vw;margin-bottom:1.05vh;font-size:1.45vw}
.row .nm{flex:1;font-weight:500}
.row .v{font-weight:700}
.row .no{width:2.6vw;font-weight:700;opacity:.5;font-variant-numeric:tabular-nums}
.row.hl{background:#fff;border-color:#fff;color:var(--b3)}
body.light .row.hl{background:var(--b3);border-color:var(--b3);color:#fff}
.row.hl .sm,.row.hl .v{color:inherit;opacity:.85}
.sm{font-size:1.05vw;font-weight:400;color:var(--mut)}
body.light .sm{color:#5B7391}
.row.hl .sm{color:rgba(255,255,255,.85)}
body.light .row.hl .sm{color:rgba(255,255,255,.85)}

.tiles{display:flex;gap:1.3vw;margin-top:1vh}
.tiles.wrap{flex-wrap:wrap}
.tiles.wrap .tile{flex:0 0 31.4%;padding:3.6vh 1vw}
.tile.winr{background:#fff;color:var(--b3);border:1px solid #fff;box-shadow:0 2vh 5vh rgba(3,16,40,.3)}
.tile.winr s{color:rgba(26,111,228,.72)}
body.light .tile.winr{background:var(--b3);color:#fff;border-color:var(--b3)}
body.light .tile.winr s{color:rgba(255,255,255,.85)}
.tile{flex:1;padding:5vh 1vw;text-align:center;border-radius:1vw}
.tile b{display:block;font-size:1.95vw;font-weight:700;letter-spacing:-.01em}
.fl{width:2.5vw;height:auto;border-radius:.22vw;vertical-align:-.42em;margin-right:.75vw;
  box-shadow:0 0 0 1px rgba(10,30,60,.13)}
.tile s{display:block;font-size:1.02vw;text-decoration:none;color:var(--mut);margin-top:.9vh}
body.light .tile s{color:#5B7391}

/* ---------- VORONKA ---------- */
.fbar{display:flex;align-items:center;gap:1.6vw;height:9.6vh;padding:0 1.9vw;margin-bottom:1.15vh;
  width:0;overflow:hidden;white-space:nowrap;border-radius:.8vw;
  background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  border:1px solid var(--line);
  transition:width 1.05s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i,0)*60ms)}
body.light .fbar{background:linear-gradient(90deg,rgba(26,111,228,.16),rgba(26,111,228,.05));border-color:rgba(26,111,228,.16)}
.fbar b{font-size:2.5vw;font-weight:700;min-width:5.2vw;font-variant-numeric:tabular-nums}
.fbar span{font-size:1.2vw;font-weight:400;opacity:.92}
.fbar.hl{background:linear-gradient(90deg,#fff,#DCEAFF);border-color:#fff;color:var(--b3)}
body.light .fbar.hl{background:linear-gradient(90deg,var(--b3),#3E8BF0);border-color:var(--b3);color:#fff}

/* ---------- RASM ---------- */
.ph{border:1.5px dashed rgba(255,255,255,.4);border-radius:1vw;display:flex;align-items:center;
  justify-content:center;color:rgba(255,255,255,.6);font-size:1vw;font-weight:500;
  background:rgba(255,255,255,.05);text-align:center;padding:2vh}
body.light .ph{border-color:rgba(26,111,228,.4);color:rgba(26,111,228,.75);background:rgba(26,111,228,.05)}
.photo{border:none;background:none;overflow:hidden;border-radius:1vw;
  box-shadow:0 2.6vh 6vh rgba(3,16,40,.42)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.bleed{position:absolute;inset:0;z-index:-1;overflow:hidden}
.bleed img{position:absolute;inset:0;width:100%;height:100%;display:block}
.bleed .bg{object-fit:cover;filter:blur(38px) saturate(1.12) brightness(1.05);transform:scale(1.16)}
.bleed .fg{object-fit:contain;object-position:right center;transform:scale(1.045);transform-origin:70% 50%;
  -webkit-mask-image:linear-gradient(90deg,transparent 24%,#000 34%);mask-image:linear-gradient(90deg,transparent 24%,#000 34%)}
.slide.on .bleed .fg{animation:kb 26s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.bleed:after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(7,32,72,.94) 0%,rgba(7,32,72,.78) 42%,rgba(7,32,72,.18) 100%)}
body.light .bleed:after{background:linear-gradient(90deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.84) 42%,rgba(255,255,255,.2) 100%)}

/* ---------- VIDEO ---------- */
.vfull{position:absolute;inset:0;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.vfull video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.vfull.missing video{display:none}
.vfull .vph{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.6vh;
  align-items:center;justify-content:center;text-align:center;
  color:#7FA6DC;font-size:2vw;font-weight:600;letter-spacing:.04em}
.vfull .vph span{font-size:.98vw;font-weight:400;opacity:.65;letter-spacing:.02em}
.vfull .vph{display:none}
.vfull.missing .vph{display:flex}
.vfull .vhint{position:absolute;bottom:5.5vh;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.6);font-size:1.05vw;letter-spacing:.09em;white-space:nowrap;
  border:1px solid rgba(255,255,255,.28);padding:.8vh 1.8vw;border-radius:4vw;
  transition:opacity .5s ease}
.vfull.missing .vhint{display:none}
.vfull.playing .vhint{opacity:0}

/* ---------- G'OLIB ---------- */
.ghost{position:absolute;right:2vw;bottom:-12vh;font-size:58vw;font-weight:700;line-height:.72;
  color:#fff;opacity:.055;pointer-events:none;letter-spacing:-.06em}
body.light .ghost{color:var(--b3);opacity:.07}
/* ---------- KATTA ORQA YOZUV ---------- */
.gw{position:absolute;left:50%;top:50%;z-index:-1;white-space:nowrap;pointer-events:none;
  font-size:29vw;font-weight:700;line-height:.8;letter-spacing:-.055em;color:#fff;opacity:0;
  transform:translate(-50%,-50%) scale(1.14);filter:blur(14px);
  transition:opacity 1.6s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1),filter 1.6s ease}
.gw.show{opacity:.06;transform:translate(-50%,-50%) scale(1);filter:blur(0)}
body.light .gw{color:var(--b3)}
body.light .gw.show{opacity:.085}
.score{font-size:6vw;font-weight:700;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score em{font-size:1.6vw;font-style:normal;font-weight:500;color:var(--mut);margin-left:.9vw}
body.light .score em{color:#5B7391}
.chip{display:inline-block;align-self:flex-start;background:#fff;color:var(--b3);
  font-weight:700;border-radius:.8vw;padding:1.5vh 2.4vw;font-size:2.5vw;letter-spacing:-.01em;
  box-shadow:0 1.6vh 4vh rgba(3,16,40,.35)}
body.light .chip{background:var(--b3);color:#fff}
.badge{display:inline-block;align-self:flex-start;background:rgba(255,255,255,.14);
  border:1px solid var(--line);color:inherit;font-weight:500;font-size:1.25vw;
  padding:1.1vh 1.7vw;border-radius:.6vw;margin-top:2.2vh}
body.light .badge{background:rgba(26,111,228,.1);border-color:rgba(26,111,228,.2)}

/* ---------- RO'YXAT ---------- */
.names{columns:3;column-gap:3.2vw;font-size:1.12vw;font-weight:400;line-height:2.2;margin-top:1vh}
.names div{break-inside:avoid}
.names b{font-weight:700;opacity:.45;margin-right:.5vw;font-variant-numeric:tabular-nums}
.names div:before{content:"·";color:var(--b3);opacity:.55;margin-right:.7vw;font-weight:700}
.tight .row{padding:1.02vh 1.5vw;font-size:1.22vw;margin-bottom:.62vh}

/* ---------- BO'LIM KARTASI ---------- */
.mid{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:2}
.prize{position:absolute;right:5.5vw;top:50%;margin-top:-1vh;transform:translateY(-50%) scale(.9);
  opacity:0;transition:opacity .55s ease, transform .85s cubic-bezier(.34,1.45,.5,1);
  transition-delay:calc(var(--i,0)*80ms)}
.prize.show{opacity:1;transform:translateY(-50%) scale(1)}
.prize img{display:block;filter:drop-shadow(0 3.4vh 7vh rgba(3,16,40,.26))}
.prize img.pcard{border-radius:1.4vw;filter:none;box-shadow:0 3.4vh 7vh rgba(3,16,40,.3)}
.slide.on .prize.show img{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2.2deg)}50%{transform:translateY(-1.6vh) rotate(2.2deg)}}
.device{border-radius:2.7vw;background:#0C1B33;padding:.5vw;box-shadow:0 4vh 9vh rgba(3,16,40,.34)}
.device .scr{height:100%;border-radius:2.25vw;overflow:hidden;background:#fff}
.device img{display:block;width:100%;height:100%;object-fit:cover}
body:not(.light) .device{background:#fff;box-shadow:0 4vh 9vh rgba(0,0,0,.4)}
.qrbox{width:29vw;aspect-ratio:1;background:#fff;border-radius:1.6vw;padding:1.6vw;
  box-shadow:0 3vh 7vh rgba(3,16,40,.18);border:1px solid rgba(26,111,228,.14)}
.qrbox img{width:100%;height:100%;display:block}
.phone{border-radius:1.6vw;overflow:hidden;box-shadow:0 3vh 7vh rgba(3,16,40,.26);background:#fff}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.phrow{display:flex;gap:2.6vw;align-items:flex-end;justify-content:center;margin-top:1vh}
.phcap{text-align:center;font-size:1.1vw;font-weight:500;color:#5B7391;margin-top:1.6vh}
body:not(.light) .phcap{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:31vh;gap:1.3vw}
.grid2 .ph{width:100%;height:100%;border-radius:1vw}
.grid2 .ph img{width:100%;height:100%;object-fit:cover}
/* ---- brend bezagi (1-slayd) ---- */
.wel{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.wel i{position:absolute;display:block;transform:skewX(-21deg)}
.wel .tex{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><g fill='%231A6FE4' opacity='0.16'><path d='M5 12 L16 18 L5 24 Z'/><path d='M22 16 L33 22 L22 28 Z'/></g></svg>");
  background-size:1.9vw 1.9vw}
.wel .pale{background:#EAF1FC}
.wel .solid{background:var(--b3)}
.wel .grad{background:linear-gradient(180deg,var(--b3) 0%, #BBD4F7 100%)}
.wel .out{border:1.6px solid rgba(26,111,228,.55)}
body:not(.light) .wel .pale{background:rgba(255,255,255,.07)}
body:not(.light) .wel .solid{background:rgba(255,255,255,.92)}
body:not(.light) .wel .grad{background:linear-gradient(180deg,#fff 0%, rgba(255,255,255,.25) 100%)}
body:not(.light) .wel .out{border-color:rgba(255,255,255,.5)}
body:not(.light) .wel .tex{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><g fill='%23ffffff' opacity='0.16'><path d='M5 12 L16 18 L5 24 Z'/><path d='M22 16 L33 22 L22 28 Z'/></g></svg>")}
/* ---- 2-slayd bezagi ---- */
.two{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.two .dots{position:absolute;left:0;top:0;width:24%;height:30%;
  background-image:radial-gradient(#AEBED6 1.7px, transparent 1.8px);background-size:1.85vw 1.85vw;
  -webkit-mask-image:linear-gradient(138deg,#000 0%,rgba(0,0,0,.35) 45%,transparent 72%);
  mask-image:linear-gradient(138deg,#000 0%,rgba(0,0,0,.35) 45%,transparent 72%);opacity:.75}
.two .sh{position:absolute;transform:skewX(-21deg);border-radius:2.2vw;
  background:linear-gradient(160deg,#D9E5F7 0%,#EFF4FC 100%)}
.two .sh2{background:linear-gradient(160deg,#E6EEF9 0%,#F6F9FD 100%)}
.two .ln{position:absolute;width:2.5px;border-radius:3px;
  background:linear-gradient(180deg,rgba(26,111,228,0) 0%,#1A6FE4 42%,rgba(26,111,228,0) 100%)}
.two .glow{position:absolute;width:4vw;height:11vw;border-radius:50%;
  background:radial-gradient(closest-side,rgba(60,140,255,.7),rgba(60,140,255,0));filter:blur(9px)}
.blu{color:#12305E}
.grad7{background:linear-gradient(158deg,#4A97F8 0%,#153B78 24%,#0A1E42 74%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
body:not(.light) .two .sh,body:not(.light) .two .sh2{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
body:not(.light) .two .dots{background-image:radial-gradient(rgba(255,255,255,.5) 1.7px,transparent 1.8px)}
body:not(.light) .blu{color:#fff}
body:not(.light) .grad7{background:linear-gradient(158deg,#BFDBFF 0%,#FFFFFF 32%,#CFE2FF 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.divi{display:flex;align-items:center;gap:1.4vw;margin:3vh 0 2.4vh}
.divi span{display:block;width:9vw;height:1.5px;background:var(--b3);opacity:.55}
.divi img{width:3.4vw}
body:not(.light) .divi span{background:#fff;opacity:.6}
.dayx{font-size:2.5vw;font-weight:700;letter-spacing:.22em;color:var(--b3)}
body:not(.light) .dayx{color:#fff}
.chap{justify-content:center}
.chap .no{font-size:10vw;font-weight:700;line-height:.9;letter-spacing:-.05em;opacity:.3}
.chap h1{font-size:5.6vw;margin-top:1vh}

/* ---------- LOGO / HUD ---------- */
.mark{position:absolute;top:5vh;right:6vw;opacity:.95}
.mark img{width:9.4vw;height:auto;display:block}
.sl{display:none!important}
body.light .sb{display:none!important}
body.light .sl{display:inline-block!important}
#sect{position:fixed;left:6vw;bottom:4.2vh;z-index:5;font-size:.82vw;font-weight:500;
  letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.42)}
body.light #sect{color:rgba(12,27,51,.4)}
#hud{position:fixed;right:6vw;bottom:4.2vh;z-index:5;font-size:.82vw;font-weight:500;
  color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums}
body.light #hud{color:rgba(12,27,51,.38)}
#bar{position:fixed;left:0;bottom:0;height:3px;z-index:6;width:0;
  background:linear-gradient(90deg,var(--b4),#fff);transition:width .5s cubic-bezier(.16,1,.3,1)}
body.light #bar{background:linear-gradient(90deg,var(--b3),var(--b2))}
#tip{position:fixed;left:6vw;bottom:1.6vh;z-index:5;font-size:.72vw;color:rgba(255,255,255,.22);transition:opacity .5s}
#tip.gone{opacity:0}
body.light #tip{color:rgba(12,27,51,.25)}

#help{position:fixed;inset:0;z-index:20;background:#fff;
  color:#0C1B33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh}
#help p{color:#5B7391}
#help kbd{background:var(--b3);color:#fff}
#help img{width:26vw;margin-bottom:2vh}
body:not(.light) #help{background:linear-gradient(150deg,#0B2E63,#09265A);color:#fff}
body:not(.light) #help p{color:#A9C7F2}
body:not(.light) #help kbd{background:#fff;color:#0B2E63}
#help.hide{display:none}
#help h4{font-size:2.7vw;font-weight:700;letter-spacing:-.02em}
#help p{font-size:1.15vw;font-weight:400;color:#A9C7F2}
kbd{background:#fff;color:#0B2E63;padding:.45vh 1vw;border-radius:.45vw;font-weight:700;font-size:1vw}
</style>
</head>

<div id="bg"></div>
<div id="deck"></div>
<div id="sect"></div>
<div id="hud"></div>
<div id="bar"></div>
<div id="tip">T — oq/ko'k fon &nbsp;·&nbsp; F — to'liq ekran</div>

/* ═══════════ MOTOR ═══════════ */
const deck=document.getElementById('deck'), hud=document.getElementById('hud'),
      bar=document.getElementById('bar'), sect=document.getElementById('sect');
D.forEach(s=>{const d=document.createElement('section');d.className='slide'+(s.chap?' chap':'');
  d.innerHTML=s.html;deck.appendChild(d);s.el=d;});
document.body.classList.add('light');
if(location.search.indexOf('blue')>=0)document.body.classList.remove('light');
document.querySelectorAll('.vfull video').forEach(v=>{
  const w=v.parentElement;
  const miss=()=>{ if(v.readyState===0) w.classList.add('missing'); };
  v.addEventListener('error',miss);
  v.addEventListener('play',()=>w.classList.add('playing'));
  v.addEventListener('pause',()=>w.classList.remove('playing'));
  v.addEventListener('ended',()=>w.classList.remove('playing'));
  setTimeout(()=>{ if(v.readyState===0 && v.networkState===3) w.classList.add('missing'); },3000);
});
let si=0, st=0, started=true;

function render(){
  D.forEach((s,i)=>s.el.classList.toggle('on', i===si));
  D.forEach((sl,i)=>{ if(i===si) return; const v=sl.el.querySelector('video');
    if(v){ v.pause(); try{v.currentTime=0;}catch(e){} } });
  const s=D[si];
  if(s.video){ const v=s.el.querySelector('video');
    if(v){ if(st>=1){ v.play().catch(()=>{}); } else { v.pause(); try{v.currentTime=0;}catch(e){} } } }
  s.el.querySelectorAll('.r,.rw,.rp,.gw').forEach(e=>e.classList.toggle('show',(+e.dataset.s)<=st));
  if(s.funnel) s.el.querySelectorAll('.fbar').forEach(b=>{b.style.width=(+b.dataset.s)<=st?b.dataset.w+'%':'0';});
  if(s.count){const n=s.el.querySelector('.num'); if(n&&(+(n.dataset.s||0))<=st) countUp(n);}
  hud.textContent=(si+1)+' / '+D.length;
  sect.textContent=s.sect||'';
  bar.style.width=((si+1)/D.length*100)+'%';
}
function countUp(el){
  if(!el||el.dataset.done)return; el.dataset.done=1;
  const n=+el.dataset.n, t0=performance.now(), dur=1250;
  (function tick(t){const p=Math.min(1,(t-t0)/dur); const e=p===1?1:1-Math.pow(2,-9*p);
    el.textContent=String(Math.round(n*e)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
    el.style.filter=p<1?'blur('+(1.6*(1-p)).toFixed(2)+'px)':'none';
    if(p<1)requestAnimationFrame(tick);})(t0);
}
function next(){const s=D[si]; if(st<(s.steps||1)-1){st++;} else if(si<D.length-1){si++;st=0;} render();}
function prev(){if(st>0){st--;} else if(si>0){si--;st=(D[si].steps||1)-1;} render();}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
addEventListener('keydown',e=>{
  document.getElementById('tip').classList.add('gone');
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next();}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev();}
  if(e.key.toLowerCase()==='f')fs();
  if(e.key.toLowerCase()==='t')document.body.classList.toggle('light');
  if(e.key==='Home'){si=0;st=0;render();}
});
addEventListener('click',()=>{document.getElementById('tip').classList.add('gone');next();});
render();
/* rasm/ papkasidan avtomatik yuklash */
document.querySelectorAll('.ph[data-img]').forEach(ph=>{
  const n=ph.dataset.img; if(!n)return;
  ['jpg','jpeg','png','JPG','PNG'].forEach(ext=>{
    const im=new Image();
    im.onload=()=>{if(ph.dataset.filled)return;ph.dataset.filled=1;
      ph.textContent='';ph.classList.add('photo');ph.appendChild(im);};
    im.src='rasm/'+n+'.'+ext;});
});
